<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IZMA ENVÍOS · Bodega de saldos americanos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#14181B; --tinta-2:#4A5257; --tinta-3:#858E93;
  --kraft:#0F8A4C; --kraft-claro:#E6F4EC;
  --sello:#C0392B; --sello-claro:#FBEBE9;
  --verde:#0B6B3A; --verde-claro:#E4F1EA;
  --fondo:#F2F4F4; --tarjeta:#FFFFFF; --linea:#DCE0E1;
  --r:10px; --sombra:0 1px 2px rgba(20,24,27,.08), 0 6px 18px rgba(20,24,27,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--fondo);color:var(--tinta);font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.marca,.cifra{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.01em}
h2{font-size:21px;font-weight:600;margin:0 0 10px}
h3{font-size:17px;font-weight:600;margin:0 0 6px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tope{position:sticky;top:0;z-index:30;background:var(--tinta);color:#fff;box-shadow:var(--sombra)}
.tope-fila{display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:1080px;margin:0 auto}
.marca{font-size:26px;font-weight:700;line-height:1;position:relative;padding:0 6px;z-index:0}
.marca::after{content:"";position:absolute;left:0;width:2.6em;top:.70em;height:.16em;background:var(--kraft);opacity:.95;z-index:-1}
.marca small{display:block;font:500 11px/1 Inter,sans-serif;letter-spacing:.14em;color:#9AA3A7;padding-top:4px}
.gopack{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 Inter,sans-serif;letter-spacing:.1em;
  color:var(--kraft);border:1px solid var(--kraft);border-radius:999px;padding:4px 9px}
.mapa{width:100%;height:auto;display:block}
.mapa path{fill:#E4E7E8;stroke:#fff;stroke-width:.8;cursor:pointer;transition:fill .15s}
.mapa path:hover{stroke:var(--tinta);stroke-width:1.4}
.mapa path[data-sel="1"]{stroke:var(--tinta);stroke-width:2}
.escala{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tinta-3);margin-top:10px;flex-wrap:wrap}
.escala i{width:24px;height:10px;border-radius:2px;display:block}
.quien{margin-left:auto;text-align:right;font-size:12px;color:#9AA3A7;line-height:1.3}
.quien b{display:block;color:#fff;font-size:13px}
.quien .bolsa{display:inline-block;margin-top:3px;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:999px;color:#fff;font-weight:600}
.quien .bolsa.deuda{background:var(--sello)}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:1080px;margin:0 auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:1px solid rgba(255,255,255,.22);background:transparent;color:#C9D0D2;padding:7px 13px;border-radius:999px;white-space:nowrap;font-weight:500;font-size:14px}
.nav button[aria-current="true"]{background:#fff;color:var(--tinta);border-color:#fff}
.nav .globo{background:var(--sello);color:#fff;border-radius:999px;padding:1px 6px;margin-left:6px;font-size:11px;font-weight:600;font-style:normal}
main{max-width:1080px;margin:0 auto;padding:16px 14px 90px}
.cinta-demo{background:var(--kraft);color:#0B2A18;font-size:12px;font-weight:600;text-align:center;padding:5px 12px}

.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);padding:14px;box-shadow:var(--sombra)}
.tarjeta+.tarjeta{margin-top:12px}
.fila{display:flex;gap:10px;align-items:center}
.fila.entre{justify-content:space-between}
.fila.envolver{flex-wrap:wrap}
.campo{display:block;margin-bottom:12px}
.campo span{display:block;font-size:13px;color:var(--tinta-2);margin-bottom:5px;font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:8px;background:#fff;color:var(--tinta)}
.campo textarea{min-height:76px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.dos{grid-template-columns:1fr}}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:600;background:var(--tinta);color:#fff}
.btn.lleno{width:100%}
.btn.kraft{background:var(--kraft)}
.btn.verde{background:var(--verde)}
.btn.rojo{background:var(--sello)}
.btn.claro{background:#fff;color:var(--tinta);border:1px solid var(--linea)}
.btn.chico{padding:7px 11px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sello{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEF1F5;color:var(--tinta-2)}
.sello.verde{background:var(--verde-claro);color:var(--verde)}
.sello.rojo{background:var(--sello-claro);color:var(--sello)}
.sello.kraft{background:var(--kraft-claro);color:#0B6B3A}
.tenue{color:var(--tinta-3);font-size:13px}
.vacio{text-align:center;padding:36px 18px;color:var(--tinta-2)}
.vacio p{margin:6px 0 14px}
.linea-arriba{border-top:1px solid var(--linea);margin-top:12px;padding-top:12px}

.monedero{background:var(--tinta);color:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--sombra)}
.monedero .rotulo{font-size:13px;color:#9AA3A7}
.monedero .grande{font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.monedero.debe{background:var(--sello)}
.monedero .fila{margin-top:12px}
.mov{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea)}
.mov:last-child{border-bottom:0}
.mov .monto{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov .monto.mas{color:var(--verde)}
.mov .monto.menos{color:var(--sello)}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pieza{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra);display:flex;flex-direction:column}
.pieza .lienzo{position:relative;aspect-ratio:4/3;background:#E4E7E8;cursor:pointer}
.pieza .lienzo img,.pieza .lienzo video{width:100%;height:100%;object-fit:cover;display:block}
.pieza .lienzo .cinta{position:absolute;top:8px;left:8px;background:rgba(20,24,27,.86);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
.pieza .lienzo .mas{position:absolute;bottom:8px;right:8px;background:rgba(20,24,27,.86);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px}
.pieza .cuerpo{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.pieza .titulo{font-weight:600;line-height:1.3}
.precio{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.agotado .lienzo{filter:grayscale(1) opacity(.6)}
.stepper{display:flex;align-items:center;border:1px solid var(--linea);border-radius:8px;overflow:hidden}
.stepper button{width:34px;height:38px;border:0;background:#fff;font-size:17px;color:var(--tinta)}
.stepper input{width:42px;height:38px;border:0;border-left:1px solid var(--linea);border-right:1px solid var(--linea);text-align:center;font-variant-numeric:tabular-nums}
.filtros{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtros button{border:1px solid var(--linea);background:#fff;color:var(--tinta-2);border-radius:999px;padding:7px 13px;white-space:nowrap;font-size:14px}
.filtros button[aria-current="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.buscador{display:flex;gap:8px;margin-bottom:12px}
.buscador input{flex:1;padding:11px 12px;border:1px solid var(--linea);border-radius:8px}

.reloj{display:inline-flex;align-items:center;gap:6px;background:var(--sello);color:#fff;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;font-size:13px}
.reloj.tibio{background:var(--kraft)}
.reloj.calmo{background:var(--tinta-2)}
.renglon{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linea)}
.renglon:last-child{border-bottom:0}
.renglon .mini{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#E4E7E8;flex:none}
.renglon .crece{flex:1;min-width:0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0}
.total .cifra{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.tachado{text-decoration:line-through;color:var(--tinta-3)}

.tablero{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.mosaico{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);padding:12px 13px}
.mosaico .cifra{font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.mosaico span{display:block;font-size:13px;color:var(--tinta-2)}
.mosaico.alerta{border-color:var(--sello);background:var(--sello-claro)}

.suelta{border:1.5px dashed var(--kraft);background:var(--kraft-claro);border-radius:var(--r);padding:18px;text-align:center;color:#0B6B3A;cursor:pointer;display:block}
.tiras{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tira{position:relative;width:78px;height:78px;border-radius:8px;overflow:hidden;border:1px solid var(--linea);background:#E4E7E8}
.tira img,.tira video{width:100%;height:100%;object-fit:cover}
.tira button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(20,24,27,.85);color:#fff;font-size:13px;line-height:1;padding:0}
.barra{height:5px;background:var(--linea);border-radius:999px;overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;background:var(--kraft);width:0;transition:width .2s}
.evidencia{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--linea);cursor:pointer}

.acceso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:var(--tinta)}
.acceso .caja{width:100%;max-width:410px;background:#fff;border-radius:14px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.acceso .marca{color:var(--tinta);font-size:38px;display:inline-block;margin-bottom:16px}
.pestanas{display:flex;gap:6px;margin-bottom:16px}
.pestanas button{flex:1;border:1px solid var(--linea);background:#fff;padding:9px;border-radius:8px;font-weight:600;color:var(--tinta-2)}
.pestanas button[aria-current="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}

#avisos{position:fixed;left:14px;right:14px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.aviso{background:var(--tinta);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:460px;font-size:14px}
.aviso.mal{background:var(--sello)}
.aviso.bien{background:var(--verde)}
#capa{position:fixed;inset:0;z-index:70;background:rgba(20,24,27,.55);display:none;align-items:flex-end;justify-content:center}
#capa.abierta{display:flex}
#capa .hoja{background:#fff;width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:18px;max-height:88vh;overflow:auto}
@media (min-width:640px){#capa{align-items:center;padding:20px}#capa .hoja{border-radius:14px}}
.mensaje{padding:11px 13px;border-radius:8px;font-size:14px;margin-bottom:12px}
.mensaje.info{background:#EEF2F7;color:var(--tinta-2)}
.mensaje.kraft{background:var(--kraft-claro);color:#0B6B3A}
.mensaje.rojo{background:var(--sello-claro);color:var(--sello)}
.mensaje.verde{background:var(--verde-claro);color:var(--verde)}
.cargando{text-align:center;padding:40px;color:var(--tinta-3)}
.ticket{font-family:'Barlow Condensed',sans-serif;border:1px solid var(--linea);border-radius:var(--r);padding:16px;background:#fff}
.ticket h3{font-size:22px;margin:0}
.ticket .lin{display:flex;justify-content:space-between;gap:10px;font-family:Inter,sans-serif;font-size:14px;padding:3px 0}
.ticket .corte{border-top:2px dashed var(--linea);margin-top:12px;padding-top:12px}
.ticket .final{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--linea);margin-top:8px;padding-top:8px}
.ticket .final b{font-size:26px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div class="acceso" id="acceso">
  <div class="caja">
    <div class="marca">IZMA<small>ENVÍOS · SALDOS AMERICANOS</small></div>
    <div class="gopack" style="margin-bottom:14px">GO PACK · paquetería</div>
    <div class="pestanas">
      <button data-pestana="entrar" aria-current="true">Entrar</button>
      <button data-pestana="solicitar">Solicitar acceso</button>
    </div>
    <form id="form-entrar">
      <label class="campo"><span>Usuario que te dio IZMA</span>
        <input name="usuario" autocomplete="username" autocapitalize="none" required></label>
      <label class="campo"><span>PIN</span>
        <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <button class="btn lleno" type="submit">Entrar</button>
      <p class="tenue" style="margin:14px 0 0">¿No tienes usuario? Solicita acceso y IZMA te lo manda por WhatsApp.</p>
      <div id="claves-demo"></div>
    </form>
    <form id="form-solicitar" hidden>
      <div class="mensaje info">Llena tus datos. IZMA los revisa y te envía tu usuario y PIN por WhatsApp.</div>
      <label class="campo"><span>Nombre completo</span><input name="nombre" required></label>
      <label class="campo"><span>WhatsApp</span><input name="telefono" inputmode="tel" required></label>
      <div class="dos">
        <label class="campo"><span>Ciudad</span><input name="ciudad"></label>
        <label class="campo"><span>Estado</span><select name="estado_mx" id="sel-estado"></select></label>
        <label class="campo"><span>Tipo de cliente</span>
          <select name="tipo"><option value="local">Local (recojo en bodega)</option>
          <option value="foraneo">Foráneo (por paquetería)</option></select></label>
      </div>
      <label class="campo" data-solo-foraneo hidden><span>Paquetería de tu preferencia</span><input name="paqueteria" placeholder="Estafeta, Castores, Tufesa…"></label>
      <label class="campo" data-solo-foraneo hidden><span>Dirección de envío</span><textarea name="direccion"></textarea></label>
      <label class="campo"><span>¿Quién te recomendó o cómo nos encontraste?</span><input name="referencia"></label>
      <button class="btn lleno kraft" type="submit">Enviar solicitud</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="tope">
    <div class="cinta-demo" id="cinta-demo" hidden>Modo demostración · los datos se guardan solo en este dispositivo</div>
    <div class="tope-fila">
      <div class="marca">IZMA<small>ENVÍOS</small></div>
      <div class="quien" id="quien"></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </header>
  <main id="vista"><div class="cargando">Cargando…</div></main>
</div>

<div id="avisos"></div>
<div id="capa"><div class="hoja" id="hoja"></div></div>

   desde el celular o desde un servidor. Da el mismo hash que digest() de Postgres. */
const K256 = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,

  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function sha256(texto) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const bytes = [];
  for (let i = 0; i < texto.length; i++) {
    const c = texto.charCodeAt(i);
    if (c < 128) bytes.push(c);
    else if (c < 2048) bytes.push(192 | (c >> 6), 128 | (c & 63));
    else if (c < 55296 || c >= 57344) bytes.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
    else {
      i++;
      const cp = 65536 + (((c & 1023) << 10) | (texto.charCodeAt(i) & 1023));
      bytes.push(240 | (cp >> 18), 128 | ((cp >> 12) & 63), 128 | ((cp >> 6) & 63), 128 | (cp & 63));
    }
  }
  const bits = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 0; i < 4; i++) bytes.push(0);
  bytes.push((bits >>> 24) & 255, (bits >>> 16) & 255, (bits >>> 8) & 255, bits & 255);

  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Array(64);
  for (let i = 0; i < bytes.length; i += 64) {
    for (let j = 0; j < 16; j++)
      w[j] = (bytes[i + 4 * j] << 24) | (bytes[i + 4 * j + 1] << 16) | (bytes[i + 4 * j + 2] << 8) | bytes[i + 4 * j + 3];
    for (let j = 16; j < 64; j++) {
      const s0 = rr(w[j - 15], 7) ^ rr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
      const s1 = rr(w[j - 2], 17) ^ rr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
      w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (let j = 0; j < 64; j++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K256[j] + w[j]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = [(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

async function rpc(fn, args = {}) {
  if (MODO_DEMO) {
    if (!BD) await cargarBD();
    await new Promise(r => setTimeout(r, 60));
    try {
      if (!LOCAL[fn]) throw new Error("Esa función todavía no existe en modo demo: " + fn);
      return LOCAL[fn](args);
    } catch (err) {
      if (/SESION_INVALIDA/.test(err.message)) { salirLocal(); throw new Error("Tu sesión expiró. Entra otra vez."); }
      if (/SIN_PERMISO/.test(err.message)) throw new Error("No tienes permiso para eso");
      throw err;
    }
  }
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON },
    body: JSON.stringify(args)
  });
  const texto = await r.text();
  let dato = null;
  try { dato = texto ? JSON.parse(texto) : null; } catch { dato = texto; }
  if (!r.ok) {
    const msj = (dato && dato.message) || "Error de conexión";
    if (/SESION_INVALIDA/.test(msj)) { salirLocal(); throw new Error("Tu sesión expiró. Entra otra vez."); }
    if (/SIN_PERMISO/.test(msj)) throw new Error("No tienes permiso para eso");
    throw new Error(msj);
  }
  return dato;
}

async function comprimir(file, max, calidad) {
  if (!file.type.startsWith("image/")) return file;
  const bitmap = await createImageBitmap(file).catch(() => null);
  if (!bitmap) return file;
  const escala = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bitmap.width * escala);
  c.height = Math.round(bitmap.height * escala);
  c.getContext("2d").drawImage(bitmap, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, "image/jpeg", calidad));
  return blob ? new File([blob], "foto.jpg", { type: "image/jpeg" }) : file;
}
const leerDataURL = f => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f);
});
async function subir(file) {
  if (MODO_DEMO) {
    if (file.type.startsWith("video/")) {
      if (file.size > 3.5 * 1024 * 1024) throw new Error("En modo demo los videos deben pesar menos de 3.5 MB");
      return { url: await leerDataURL(file), tipo: "video" };
    }
    const chico = await comprimir(file, 760, 0.6);
    return { url: await leerDataURL(chico), tipo: "foto" };
  }
  const listo = await comprimir(file, 1400, 0.82);
  const ext = (listo.name.split(".").pop() || "jpg").toLowerCase().slice(0, 5);
  const ruta = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
  const r = await fetch(SUPABASE_URL + "/storage/v1/object/" + BUCKET + "/" + ruta, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON, "Content-Type": listo.type || "application/octet-stream" },
    body: listo
  });
  if (!r.ok) throw new Error("No se pudo subir el archivo");
  return { url: SUPABASE_URL + "/storage/v1/object/public/" + BUCKET + "/" + ruta, tipo: listo.type.startsWith("video") ? "video" : "foto" };
}

async function cargarBD() {
  try { BD = JSON.parse(almacen.get(LLAVE_DEMO)); } catch { BD = null; }
  if (!BD || !BD.usuarios) { BD = await semillaBD(); guardarBD(); }
}
async function reiniciarBD() { almacen.del(LLAVE_DEMO); BD = await semillaBD(); guardarBD(); }

const uJson = u => ({
  id: u.id, usuario: u.usuario, nombre: u.nombre, rol: u.rol, tipo_cliente: u.tipo_cliente,
  telefono: u.telefono, ciudad: u.ciudad, direccion: u.direccion, paqueteria: u.paqueteria,
  estado_mx: u.estado_mx || "", saldo: u.saldo, limite_credito: u.limite_credito
});
function usuarioDe(token) {
  const s = BD.sesiones.find(x => x.token === token);
  if (!s) return null;
  const u = BD.usuarios.find(x => x.id === s.usuario_id);
  return u && u.estado === "activo" ? u : null;
}
function exige(token, roles) {
  const u = usuarioDe(token);
  if (!u) throw new Error("SESION_INVALIDA");
  if (roles && !roles.includes(u.rol)) throw new Error("SIN_PERMISO");
  return u;
}
function liberar() {
  const t = Date.now();
  BD.apartados.filter(a => a.estado === "activo" && new Date(a.expira_en) <= t).forEach(a => {
    const p = BD.productos.find(x => x.id === a.producto_id);
    if (p) { p.disponible += a.cantidad; if (p.estado === "agotado") p.estado = "activo"; }
    a.estado = "expirado";
  });
  BD.abonos.filter(b => b.estado === "pendiente" && b.metodo === "retiro_sin_tarjeta" && b.vence_en && new Date(b.vence_en) <= t)
    .forEach(b => b.estado = "vencido");
  guardarBD();
}
function bitacora(u, accion, objeto, ref, detalle) {
  if (!BD.bitacora) BD.bitacora = [];
  BD.bitacora.push({ id: uid(), actor_usuario: u ? u.usuario : "—", accion, objeto: objeto || "",
                     ref: ref || "", detalle: detalle || null, creado_en: ahora() });
}
function confirmaPin(u, hash) {
  if (!hash) throw new Error("Necesitas confirmar con tu PIN");
  if (hash !== u.pin_hash) throw new Error("PIN incorrecto");
}
function movimiento(u, tipo, monto, concepto, ref) {
  u.saldo = redondea(u.saldo + monto);
  BD.movimientos.push({ id: uid(), usuario_id: u.id, tipo, monto: redondea(monto), concepto,
                        ref: ref || "", saldo: u.saldo, creado_en: ahora() });
}
function contenidoCaja(cajaId) {
  const arr = [];
  BD.items.filter(i => i.caja_id === cajaId).forEach(i => {
    const ped = BD.pedidos.find(p => p.id === i.pedido_id) || {};
    arr.push({ clase: "item", id: i.id, titulo: i.titulo, cantidad: i.cantidad,
               valor: redondea(i.precio * i.cantidad), origen: ped.folio || "", fecha: ped.creado_en });
  });
  (BD.recolecciones || []).filter(r => r.caja_id === cajaId).forEach(r => {
    arr.push({ clase: "reco", id: r.id, titulo: r.descripcion || ("Paquete de " + r.bodega),
               cantidad: r.piezas || 1, valor: 0, origen: r.referencia, fecha: r.creado_en });
  });
  return arr;
}

/* Lo que un cliente tiene físicamente en la bodega de IZMA */
function bodegaDe(usuarioId) {
  const dias = f => Math.max(0, Math.floor((Date.now() - new Date(f)) / 86400000));
  const enBodega = [];
  BD.items.filter(i => i.estado === "asignado" && !i.caja_id && (i.alm || "en_bodega") === "en_bodega")
    .forEach(i => {
      const ped = BD.pedidos.find(p => p.id === i.pedido_id);
      if (!ped || ped.usuario_id !== usuarioId || ped.estado === "cancelado") return;
      enBodega.push({ clase: "item", id: i.id, titulo: i.titulo, cantidad: i.cantidad,
                      valor: redondea(i.precio * i.cantidad), origen: ped.folio,
                      fecha: ped.creado_en, dias: dias(ped.creado_en) });
    });
  (BD.recolecciones || []).filter(r => r.usuario_id === usuarioId && !r.caja_id &&
      (r.estado === "recolectada" || r.estado === "en_bodega"))
    .forEach(r => enBodega.push({ clase: "reco", id: r.id,
      titulo: r.descripcion || ("Paquete de " + r.bodega), cantidad: r.piezas || 1, valor: 0,
      origen: r.referencia, fecha: r.creado_en, dias: dias(r.creado_en) }));

  const caja = (BD.cajas || []).find(c => c.usuario_id === usuarioId &&
    (c.estado === "abierta" || c.estado === "solicitada" || c.estado === "cerrada"));
  const contenido = caja ? contenidoCaja(caja.id) : [];
  const cajasEnviadas = (BD.cajas || []).filter(c => c.usuario_id === usuarioId && c.enviado_en)
    .sort((a, b) => b.enviado_en.localeCompare(a.enviado_en)).slice(0, 10);

  return { ok: true,
    en_bodega: enBodega.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha))),
    caja: caja
      ? Object.assign({}, caja, { contenido, piezas: contenido.reduce((a, x) => a + x.cantidad, 0),
                                  valor: redondea(contenido.reduce((a, x) => a + x.valor, 0)) })
      : { id: "", folio: "", estado: "", contenido: [], piezas: 0, valor: 0 },
    enviadas: cajasEnviadas,
    total: { piezas: enBodega.reduce((a, x) => a + x.cantidad, 0),
             valor: redondea(enBodega.reduce((a, x) => a + x.valor, 0)),
             dias: enBodega.length ? Math.max(...enBodega.map(x => x.dias)) : 0 } };
}

const apartadasDe = id => BD.apartados.filter(a => a.estado === "activo" && a.producto_id === id).reduce((s, a) => s + a.cantidad, 0);

/* Corte de una jornada de venta: vendido, comisión del vendedor y lo que va a IZMA */
function resumenVenta(v) {
  const prods = BD.productos.filter(p => p.venta_id === v.id);
  const ids = prods.map(p => p.id);
  const partidas = BD.items.filter(i => ids.includes(i.producto_id));
  const asignadas = partidas.filter(i => i.estado === "asignado");
  const vendido = redondea(asignadas.reduce((s, i) => s + i.precio * i.cantidad, 0));
  const comision = redondea(vendido * Number(v.comision_pct || 0) / 100);
  return {
    productos: prods.length,
    piezas: prods.reduce((s, p) => s + p.cantidad, 0),
    disponibles: prods.reduce((s, p) => s + p.disponible, 0),
    partidas: partidas.length,
    por_confirmar: asignadas.filter(i => !i.confirmado).length,
    rechazadas: partidas.length - asignadas.length,
    vendido, comision, a_izma: redondea(vendido - comision)
  };
}

/* Regresa una partida al inventario y el importe al saldo del cliente */
function devolverPartida(i, motivo) {
  const ped = BD.pedidos.find(x => x.id === i.pedido_id);
  const cli = BD.usuarios.find(x => x.id === ped.usuario_id);
  const pr = BD.productos.find(x => x.id === i.producto_id);
  if (pr) {
    pr.disponible += i.cantidad;
    pr.vendidos = Math.max(0, pr.vendidos - i.cantidad);
    if (pr.estado === "agotado") pr.estado = "activo";
  }
  i.estado = "rechazado";
  i.motivo = motivo || "No alcanzó mercancía";
  const importe = redondea(i.precio * i.cantidad);
  ped.total = redondea(ped.total - importe);
  movimiento(cli, "devolucion", importe, "No alcanzó: " + i.titulo + " (" + ped.folio + ")", ped.folio);
  guardarBD();
}

  /* ---- catálogo y apartados ---- */
  catalogo({ p_token, p_busqueda, p_categoria }) {

      }));
    const categorias = [...new Set(BD.productos.filter(p => p.estado !== "oculto").map(p => p.categoria))];
    return { ok: true, items, categorias, saldo: u.saldo, config: Object.assign({}, BD.config) };
  },
  apartar({ p_token, p_producto, p_cantidad }) {
    const u = exige(p_token);
    if (u.rol !== "cliente") return { ok: false, motivo: "Solo los clientes autorizados pueden apartar" };
    liberar();
    const q = Math.max(1, parseInt(p_cantidad || 1, 10));
    const p = BD.productos.find(x => x.id === p_producto);
    if (!p) return { ok: false, motivo: "Ese producto ya no existe" };

    if (p.disponible < q)
      return { ok: false, motivo: p.disponible === 0 ? "Alguien más lo apartó primero" : "Solo quedan " + p.disponible };
    p.disponible -= q;
    if (p.disponible === 0) p.estado = "agotado";
    const mins = BD.config.minutos_apartado;
    const expira = new Date(Date.now() + mins * 60000).toISOString();
    const ya = BD.apartados.find(a => a.estado === "activo" && a.producto_id === p.id && a.usuario_id === u.id);
    if (ya) { ya.cantidad += q; ya.expira_en = expira; }
    else BD.apartados.push({ id: uid(), producto_id: p.id, usuario_id: u.id, pedido_id: null,

    return { ok: true, expira_en: expira, minutos: mins };
  },
  soltar({ p_token, p_apartado }) {

    const vivos = BD.apartados.filter(a => a.usuario_id === u.id && a.estado === "activo");

      movimientos: BD.movimientos.filter(m => m.usuario_id === u.id).sort((a, b) => b.creado_en.localeCompare(a.creado_en)).slice(0, 40),
      config: Object.assign({}, BD.config)
    };
  },
  crear_abono({ p_token, p_datos }) {
    const u = exige(p_token);
    if (u.rol !== "cliente") return { ok: false, motivo: "Solo los clientes registran abonos" };
    const c = BD.config;
    const d = p_datos || {};
    const monto = redondea(d.monto);
    if (!monto || monto <= 0) return { ok: false, motivo: "Pon el monto del depósito" };
    if (!d.evidencia) return { ok: false, motivo: "Sube la foto del comprobante" };

    if (d.metodo === "transferencia") {
      if (monto >= c.tope_transferencia)
        return { ok: false, motivo: "Las transferencias deben ser menores a " + dinero(c.tope_transferencia) + ". Usa retiro sin tarjeta." };
      if (!String(d.referencia || "").trim()) return { ok: false, motivo: "Pon la referencia o clave de rastreo" };
    } else if (d.metodo === "retiro_sin_tarjeta") {
      if (monto < c.retiro_min) return { ok: false, motivo: "El retiro sin tarjeta es desde " + dinero(c.retiro_min) };
      if (monto > c.retiro_max) return { ok: false, motivo: "Máximo " + dinero(c.retiro_max) + " por retiro" };
      if (monto % c.retiro_multiplo !== 0) return { ok: false, motivo: "El monto debe ser múltiplo de $" + c.retiro_multiplo };
      if (!String(d.codigo || "").trim()) return { ok: false, motivo: "Falta la clave de retiro" };
      if (!d.vence_en || new Date(d.vence_en) <= new Date())
        return { ok: false, motivo: "Pon hasta qué hora se puede retirar" };
    } else return { ok: false, motivo: "Método no válido" };

    BD.abonos.push({
      id: uid(), usuario_id: u.id, metodo: d.metodo, monto,
      banco: d.metodo === "retiro_sin_tarjeta" ? c.banco_retiro : (d.banco || ""),
      referencia: d.referencia || "", codigo: d.codigo || "", celular: d.celular || "",
      vence_en: d.vence_en || null, evidencia: d.evidencia, nota: d.nota || "",
      estado: "pendiente", nota_izma: "", monto_cobrado: null,
      creado_en: ahora(), resuelto_en: null
    });
    guardarBD();
    return { ok: true };
  },
  cancelar_abono({ p_token, p_abono }) {
    const u = exige(p_token);
    const b = BD.abonos.find(x => x.id === p_abono && x.usuario_id === u.id && x.estado === "pendiente");
    if (b) { b.estado = "cancelado"; b.resuelto_en = ahora(); guardarBD(); }
    return { ok: true };
  },

  /* ---- vendedor ---- */
  publicar_producto({ p_token, p_datos }) {
    const u = exige(p_token, ["vendedor", "admin"]);
    if (!String(p_datos.titulo || "").trim()) return { ok: false, motivo: "Ponle un nombre al producto" };
    const v = BD.ventas.find(x => x.vendedor_id === u.id && x.estado === "abierta");
    if (!v && u.rol === "vendedor")
      return { ok: false, motivo: "Abre primero una venta para subir productos" };
    const cant = Math.max(1, parseInt(p_datos.cantidad || 1, 10));
    BD.productos.push({
      id: uid(), titulo: p_datos.titulo.trim(), descripcion: p_datos.descripcion || "",
      categoria: (p_datos.categoria || "").trim() || "General", precio: Number(p_datos.precio || 0),
      cantidad: cant, disponible: cant, vendidos: 0,
      origen: p_datos.origen || (v ? v.lugar : ""),
      media: p_datos.media || [], vendedor_id: u.id, venta_id: v ? v.id : null,
      estado: "activo", creado_en: ahora()
    });
    guardarBD();
    return { ok: true, venta: v ? v.nombre : "" };
  },

  /* ---- jornadas de venta ---- */
  ventas({ p_token }) {
    const u = exige(p_token, ["vendedor", "admin"]);
    liberar();
    const items = BD.ventas.filter(v => u.rol === "admin" || v.vendedor_id === u.id)
      .sort((a, b) => b.creado_en.localeCompare(a.creado_en))
      .map(v => Object.assign({}, v, resumenVenta(v), {
        vendedor: (BD.usuarios.find(x => x.id === v.vendedor_id) || {}).nombre || "IZMA"
      }));
    return { ok: true, items, comision_pct: BD.config.comision_pct };
  },
  abrir_venta({ p_token, p_datos }) {
    const u = exige(p_token, ["vendedor", "admin"]);
    const d = p_datos || {};
    if (BD.ventas.some(v => v.vendedor_id === u.id && v.estado === "abierta"))
      return { ok: false, motivo: "Ya tienes una venta abierta. Ciérrala antes de abrir otra." };
    if (!String(d.nombre || "").trim()) return { ok: false, motivo: "Ponle nombre a la venta" };
    const v = {
      id: uid(), nombre: d.nombre.trim(), lugar: d.lugar || "", vendedor_id: u.id,
      comision_pct: Number(d.comision_pct != null ? d.comision_pct : BD.config.comision_pct),
      estado: "abierta", folio_ticket: "", creado_en: ahora(), cerrado_en: null
    };
    BD.ventas.push(v);
    guardarBD();
    return { ok: true, id: v.id };
  },
  venta_detalle({ p_token, p_venta }) {
    const u = exige(p_token, ["vendedor", "admin"]);
    const v = BD.ventas.find(x => x.id === p_venta);
    if (!v) return { ok: false, motivo: "Venta no encontrada" };
    if (u.rol === "vendedor" && v.vendedor_id !== u.id) return { ok: false, motivo: "Esa venta no es tuya" };
    const productos = BD.productos.filter(p => p.venta_id === v.id)
      .map(p => Object.assign({}, p, { apartados: apartadasDe(p.id) }));
    const ids = productos.map(p => p.id);
    const partidas = BD.items.filter(i => ids.includes(i.producto_id)).map(i => {
      const ped = BD.pedidos.find(x => x.id === i.pedido_id) || {};
      const c = BD.usuarios.find(x => x.id === ped.usuario_id) || {};
      return Object.assign({}, i, {
        cliente: c.nombre || "", usuario: c.usuario || "", telefono: c.telefono || "",
        tipo_cliente: c.tipo_cliente || "", folio: ped.folio || "", fecha: ped.creado_en || ""
      });
    }).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    return {
      ok: true, partidas, productos,
      venta: Object.assign({}, v, resumenVenta(v), {
        vendedor: (BD.usuarios.find(x => x.id === v.vendedor_id) || {}).nombre || "IZMA"
      })
    };
  },
  resolver_partida({ p_token, p_item, p_accion, p_motivo }) {
    const u = exige(p_token, ["vendedor", "admin"]);
    const i = BD.items.find(x => x.id === p_item);
    if (!i) return { ok: false, motivo: "Partida no encontrada" };
    const pr = BD.productos.find(x => x.id === i.producto_id) || {};
    if (u.rol === "vendedor" && pr.vendedor_id !== u.id)
      return { ok: false, motivo: "Esa partida no es de tus productos" };
    if (i.estado !== "asignado") return { ok: false, motivo: "Esa partida ya está rechazada" };
    if (p_accion === "confirmar") {
      i.confirmado = true;
      bitacora(u, "confirmó partida", "partida", i.titulo, null);
      guardarBD();
      return { ok: true };
    }
    devolverPartida(i, p_motivo);
    bitacora(u, "marcó que no alcanzó", "partida", i.titulo, { importe: redondea(i.precio * i.cantidad), motivo: p_motivo });
    return { ok: true };
  },
  cerrar_venta({ p_token, p_venta }) {
    const u = exige(p_token, ["vendedor", "admin"]);
    const v = BD.ventas.find(x => x.id === p_venta);
    if (!v) return { ok: false, motivo: "Venta no encontrada" };
    if (u.rol === "vendedor" && v.vendedor_id !== u.id) return { ok: false, motivo: "Esa venta no es tuya" };
    if (v.estado === "cerrada") return { ok: false, motivo: "Esa venta ya está cerrada" };
    liberar();
    const r = resumenVenta(v);
    BD.folio_ticket = (BD.folio_ticket || 0) + 1;
    const f = new Date();
    v.folio_ticket = "TK" + String(f.getFullYear()).slice(2) + String(f.getMonth() + 1).padStart(2, "0") +
                     String(f.getDate()).padStart(2, "0") + String(BD.folio_ticket).padStart(3, "0");
    v.estado = "cerrada";
    v.cerrado_en = ahora();
    v.corte = r;
    bitacora(u, "cerró venta", "venta", v.nombre, r);
    BD.productos.filter(p => p.venta_id === v.id && p.estado === "activo" && p.disponible > 0)
      .forEach(p => p.estado = "oculto");
    guardarBD();
    return { ok: true, folio: v.folio_ticket };
  },
  ticket({ p_token, p_venta }) {
    const u = exige(p_token, ["vendedor", "admin"]);
    const v = BD.ventas.find(x => x.id === p_venta);
    if (!v) return { ok: false, motivo: "Venta no encontrada" };
    if (u.rol === "vendedor" && v.vendedor_id !== u.id) return { ok: false, motivo: "Esa venta no es tuya" };
    const ids = BD.productos.filter(p => p.venta_id === v.id).map(p => p.id);
    const lineas = BD.items.filter(i => ids.includes(i.producto_id) && i.estado === "asignado").map(i => {
      const ped = BD.pedidos.find(x => x.id === i.pedido_id) || {};
      const c = BD.usuarios.find(x => x.id === ped.usuario_id) || {};
      return { titulo: i.titulo, precio: i.precio, cantidad: i.cantidad,
               importe: redondea(i.precio * i.cantidad), cliente: c.nombre || "",
               folio: ped.folio || "", fecha: ped.creado_en || "" };
    });
    return {
      ok: true, lineas,
      venta: Object.assign({}, v, resumenVenta(v), {
        vendedor: (BD.usuarios.find(x => x.id === v.vendedor_id) || {}).nombre || "IZMA"
      })
    };
  },
  mis_productos({ p_token }) {
    const u = exige(p_token, ["vendedor", "admin"]);
    liberar();
    const items = BD.productos.filter(p => p.vendedor_id === u.id)
      .sort((a, b) => b.creado_en.localeCompare(a.creado_en))
      .map(p => Object.assign({}, p, { apartados: apartadasDe(p.id) }));
    return { ok: true, items };
  },
  editar_producto({ p_token, p_id, p_datos }) {
    const u = exige(p_token, ["vendedor", "admin"]);
    const p = BD.productos.find(x => x.id === p_id);
    if (!p) return { ok: false, motivo: "No existe" };
    if (u.rol === "vendedor" && p.vendedor_id !== u.id) return { ok: false, motivo: "Ese producto no es tuyo" };
    if (p_datos.cantidad !== undefined) {
      const nueva = Math.max(0, parseInt(p_datos.cantidad, 10));
      const delta = nueva - p.cantidad;
      if (p.disponible + delta < 0) return { ok: false, motivo: "No puedes bajar la cantidad debajo de lo apartado o vendido" };
      p.cantidad = nueva; p.disponible += delta;
    }
    ["titulo", "descripcion", "categoria", "origen"].forEach(k => { if (p_datos[k]) p[k] = p_datos[k]; });
    if (p_datos.precio !== undefined) p.precio = Number(p_datos.precio);
    if (p_datos.media) p.media = p_datos.media;
    if (p_datos.estado) p.estado = p_datos.estado;
    if (p.estado !== "oculto") p.estado = p.disponible === 0 ? "agotado" : "activo";
    guardarBD();
    return { ok: true };
  },

  /* ---- administración ---- */
  admin_resumen({ p_token }) {
    exige(p_token, ["admin"]);
    liberar();
    const hoy = new Date().toDateString();
    const d = new Date();
    const validos = BD.pedidos.filter(p => p.estado !== "cancelado");
    const clientes = BD.usuarios.filter(u => u.rol === "cliente" && u.estado === "activo");
    return {
      ok: true,
      solicitudes: BD.solicitudes.filter(s => s.estado === "pendiente").length,
      abonos: BD.abonos.filter(b => b.estado === "pendiente").length,
      por_cobrar: redondea(BD.abonos.filter(b => b.estado === "pendiente").reduce((s, b) => s + b.monto, 0)),
      por_enviar: BD.pedidos.filter(p => p.estado === "preparando").length,
      productos: BD.productos.filter(p => p.estado === "activo").length,
      apartados: BD.apartados.filter(a => a.estado === "activo").length,
      clientes: clientes.length,
      deuda: redondea(clientes.filter(u => u.saldo < 0).reduce((s, u) => s - u.saldo, 0)),
      a_favor: redondea(clientes.filter(u => u.saldo > 0).reduce((s, u) => s + u.saldo, 0)),
      venta_hoy: redondea(validos.filter(p => new Date(p.creado_en).toDateString() === hoy).reduce((s, p) => s + p.total, 0)),
      venta_mes: redondea(validos.filter(p => { const x = new Date(p.creado_en); return x.getMonth() === d.getMonth() && x.getFullYear() === d.getFullYear(); })
                                 .reduce((s, p) => s + p.total, 0))
    };
  },
  admin_solicitudes({ p_token, p_estado }) {
    exige(p_token, ["admin"]);
    return { ok: true, items: BD.solicitudes.filter(s => !p_estado || s.estado === p_estado)
      .sort((a, b) => b.creada_en.localeCompare(a.creada_en)) };
  },
  admin_aprobar_solicitud({ p_token, p_solicitud, p_usuario, p_pin_hash, p_saldo, p_limite }) {
    exige(p_token, ["admin"]);
    const s = BD.solicitudes.find(x => x.id === p_solicitud && x.estado === "pendiente");
    if (!s) return { ok: false, motivo: "Solicitud no encontrada" };
    const usuario = String(p_usuario || "").trim().toLowerCase();
    if (!usuario) return { ok: false, motivo: "Asígnale un nombre de usuario" };
    if (BD.usuarios.some(u => u.usuario.toLowerCase() === usuario)) return { ok: false, motivo: "Ese usuario ya está ocupado" };
    const nu = {
      id: uid(), usuario, pin_hash: p_pin_hash, nombre: s.nombre, rol: "cliente",
      tipo_cliente: s.tipo_cliente, telefono: s.telefono, ciudad: s.ciudad, direccion: s.direccion,
      paqueteria: s.paqueteria, estado_mx: s.estado_mx || "",
      saldo: 0, limite_credito: Number(p_limite || 0), estado: "activo",
      notas: "", creado_en: ahora(), ultimo_acceso: null
    };
    BD.usuarios.push(nu);
    if (Number(p_saldo) > 0) movimiento(nu, "ajuste", Number(p_saldo), "Saldo a favor inicial");
    Object.assign(s, { estado: "aprobada", usuario_dado: usuario, resuelta_en: ahora() });
    guardarBD();
    return { ok: true, usuario, telefono: s.telefono, nombre: s.nombre };
  },
  admin_rechazar_solicitud({ p_token, p_solicitud, p_motivo }) {
    exige(p_token, ["admin"]);
    const s = BD.solicitudes.find(x => x.id === p_solicitud && x.estado === "pendiente");
    if (s) { Object.assign(s, { estado: "rechazada", motivo: p_motivo || "", resuelta_en: ahora() }); guardarBD(); }
    return { ok: true };
  },
  admin_abonos({ p_token, p_estado }) {
    exige(p_token, ["admin"]);
    liberar();
    const items = BD.abonos.filter(b => !p_estado || b.estado === p_estado)
      .sort((a, b) => b.creado_en.localeCompare(a.creado_en))
      .map(b => {
        const c = BD.usuarios.find(u => u.id === b.usuario_id) || {};
        return Object.assign({}, b, { cliente: c.nombre, usuario: c.usuario, telefono: c.telefono, saldo: c.saldo });
      });
    return { ok: true, items, config: Object.assign({}, BD.config) };
  },
  admin_resolver_abono({ p_token, p_abono, p_accion, p_monto, p_nota, p_pin_hash }) {
    const admin = exige(p_token, ["admin"]);
    confirmaPin(admin, p_pin_hash);
    const b = BD.abonos.find(x => x.id === p_abono);
    if (!b) return { ok: false, motivo: "Depósito no encontrado" };
    if (b.estado === "cobrado") return { ok: false, motivo: "Ese depósito ya está cobrado" };
    const u = BD.usuarios.find(x => x.id === b.usuario_id);
    if (p_accion === "cobrado") {
      const monto = redondea(p_monto || b.monto);
      if (monto <= 0) return { ok: false, motivo: "El monto cobrado debe ser mayor a cero" };
      b.estado = "cobrado"; b.monto_cobrado = monto; b.resuelto_en = ahora(); b.nota_izma = p_nota || "";
      movimiento(u, "abono", monto,
        (b.metodo === "retiro_sin_tarjeta" ? "Retiro sin tarjeta cobrado" : "Transferencia recibida"),
        b.referencia || b.codigo || "");
      bitacora(admin, "cobró depósito", "cliente", u.usuario,
        { metodo: b.metodo, declarado: b.monto, cobrado: monto, saldo: u.saldo });
    } else {
      b.estado = "rechazado"; b.resuelto_en = ahora(); b.nota_izma = p_nota || "";
      bitacora(admin, "rechazó depósito", "cliente", u.usuario, { monto: b.monto, motivo: p_nota });
    }
    guardarBD();
    return { ok: true, saldo: u.saldo };
  },
  admin_ajustar_saldo({ p_token, p_usuario, p_monto, p_concepto, p_pin_hash }) {
    const a = exige(p_token, ["admin"]);
    confirmaPin(a, p_pin_hash);
    const u = BD.usuarios.find(x => x.id === p_usuario);
    if (!u) return { ok: false, motivo: "Cliente no encontrado" };
    const monto = redondea(p_monto);
    if (!monto) return { ok: false, motivo: "Pon un monto distinto de cero" };
    const antes = u.saldo;
    movimiento(u, "ajuste", monto, p_concepto || "Ajuste de IZMA");
    bitacora(a, "ajustó saldo", "cliente", u.usuario, { monto, antes, despues: u.saldo, concepto: p_concepto });
    guardarBD();
    return { ok: true, saldo: u.saldo };
  },
  admin_limite({ p_token, p_usuario, p_limite, p_pin_hash }) {
    const a = exige(p_token, ["admin"]);
    confirmaPin(a, p_pin_hash);
    const u = BD.usuarios.find(x => x.id === p_usuario);
    if (!u) return { ok: false, motivo: "Cliente no encontrado" };
    const antes = u.limite_credito;
    u.limite_credito = Math.max(0, Number(p_limite || 0));
    bitacora(a, "cambió el crédito", "cliente", u.usuario, { antes, despues: u.limite_credito });
    guardarBD();
    return { ok: true };
  },
  /* ---- recolección de paquetes en otras bodegas ---- */
  crear_recoleccion({ p_token, p_datos }) {

      referencia: d.referencia.trim(), a_nombre: d.a_nombre || "", descripcion: d.descripcion || "",
      piezas: Number(d.piezas || 1), contacto: d.contacto || "", foto: d.foto || "",
      estado: "solicitada", programada: "", recolectada_en: null, recolector: "",
      bultos: 0, peso_kg: 0, costo: 0, costo_cobrado: false, nota_izma: "",
      creado_en: ahora()
    });

    guardarBD();
    return { ok: true };
  },
  lista_clientes({ p_token }) {

    });

  mis_recolecciones({ p_token }) {

      .sort((a, b) => b.creado_en.localeCompare(a.creado_en));

  },

  caja_agregar({ p_token, p_tipo, p_id }) {

    if (!caja) {
      if (!BD.cajas) BD.cajas = [];
      BD.folio_caja = (BD.folio_caja || 0) + 1;
      const f = new Date();
      caja = { id: uid(), usuario_id: u.id,
        folio: "CJ" + String(f.getFullYear()).slice(2) + String(f.getMonth() + 1).padStart(2, "0") +
               String(f.getDate()).padStart(2, "0") + String(BD.folio_caja).padStart(3, "0"),
        estado: "abierta", paqueteria: "", guia: "", bultos: 1, peso_kg: 0,
        largo_cm: 0, ancho_cm: 0, alto_cm: 0, costo_envio: 0, flete: "por_cobrar", flete_cobrado: false,
        destino: "", entrega_estimada: "", notas: "", notas_izma: "",
        enviado_en: null, creado_en: ahora() };
      BD.cajas.push(caja);
    }
    if (p_tipo === "reco") {
      const r = (BD.recolecciones || []).find(x => x.id === p_id && x.usuario_id === u.id);
      if (!r) return { ok: false, motivo: "No encontrado" };
      r.caja_id = caja.id;
    } else {
      const i = BD.items.find(x => x.id === p_id);
      if (!i) return { ok: false, motivo: "No encontrado" };
      const ped = BD.pedidos.find(p => p.id === i.pedido_id);
      if (!ped || ped.usuario_id !== u.id) return { ok: false, motivo: "Eso no es tuyo" };
      i.alm = "en_caja"; i.caja_id = caja.id;
    }
    guardarBD();
    return { ok: true, caja: caja.folio };
  },

      if (r) r.caja_id = null;
    } else {
      const i = BD.items.find(x => x.id === p_id);

  admin_cliente({ p_token, p_usuario }) {
    exige(p_token, ["admin", "vendedor"]);
    const u = BD.usuarios.find(x => x.id === p_usuario);
    if (!u) return { ok: false, motivo: "Cliente no encontrado" };
    const b = bodegaDe(u.id);
    const cajas = (BD.cajas || []).filter(c => c.usuario_id === u.id)
      .sort((a, c) => c.creado_en.localeCompare(a.creado_en))
      .map(c => Object.assign({}, c, { contenido: contenidoCaja(c.id) }));

    const compras = BD.pedidos.filter(p => p.usuario_id === u.id)
      .sort((a, c) => c.creado_en.localeCompare(a.creado_en))
      .map(p => Object.assign({}, p, {
        items: BD.items.filter(i => i.pedido_id === p.id).map(i => {
          const caja = (BD.cajas || []).find(c => c.id === i.caja_id);
          return Object.assign({}, i, {
            donde: i.estado === "rechazado" ? "no alcanzó"
                 : i.alm === "enviado" ? "enviada" + (caja ? " en " + caja.folio : "")
                 : i.caja_id ? "en su caja" + (caja ? " " + caja.folio : "")
                 : "en bodega"
          });
        })
      }));

    const movs = BD.movimientos.filter(m => m.usuario_id === u.id)
      .sort((a, c) => c.creado_en.localeCompare(a.creado_en));
    const suma = f => redondea(movs.filter(f).reduce((a, m) => a + Math.abs(Number(m.monto)), 0));

    return { ok: true,
      cliente: Object.assign(uJson(u), { estado: u.estado, creado_en: u.creado_en, ultimo_acceso: u.ultimo_acceso }),
      bodega: b, cajas, compras,
      recolecciones: (BD.recolecciones || []).filter(r => r.usuario_id === u.id)
        .sort((a, c) => c.creado_en.localeCompare(a.creado_en)),
      abonos: BD.abonos.filter(a => a.usuario_id === u.id)
        .sort((a, c) => c.creado_en.localeCompare(a.creado_en)),
      movimientos: movs.slice(0, 60),
      totales: {
        abonado: suma(m => m.tipo === "abono"),
        comprado: suma(m => m.tipo === "compra"),
        cargos: suma(m => m.tipo === "cargo"),
        devuelto: suma(m => m.tipo === "devolucion"),
        piezas_bodega: b.total.piezas, valor_bodega: b.total.valor,
        cajas_enviadas: cajas.filter(c => c.enviado_en).length
      } };
  },
  admin_mapa({ p_token }) {
    exige(p_token, ["admin"]);
    const por = {};
    const toca = (id, campo, cuanto) => {
      if (!id) return;
      if (!por[id]) por[id] = { clientes: 0, pedidos: 0, importe: 0, kilos: 0 };
      por[id][campo] += cuanto;
    };
    BD.usuarios.filter(u => u.rol === "cliente" && u.estado === "activo")
      .forEach(u => toca(estadoDe(u), "clientes", 1));
    BD.pedidos.filter(p => p.estado !== "cancelado").forEach(p => {
      const c = BD.usuarios.find(u => u.id === p.usuario_id);
      if (!c) return;
      const id = estadoDe(c);
      toca(id, "pedidos", 1);
      toca(id, "importe", Number(p.total || 0));
      toca(id, "kilos", Number(p.peso_kg || 0));
    });
    Object.keys(por).forEach(k => {
      por[k].importe = redondea(por[k].importe);
      por[k].kilos = redondea(por[k].kilos);
    });
    return { ok: true, estados: por,
      sin_estado: BD.usuarios.filter(u => u.rol === "cliente" && u.estado === "activo" && !estadoDe(u)).length };
  },

    });
    if (p_datos.pin_hash) u.pin_hash = p_datos.pin_hash;
    if (p_datos.estado === "suspendido") BD.sesiones = BD.sesiones.filter(s => s.usuario_id !== u.id);
    guardarBD();
    return { ok: true };
  },
  admin_pedidos({ p_token, p_estado }) {
    exige(p_token, ["admin"]);
    const items = BD.pedidos.filter(p => !p_estado || p.estado === p_estado)
      .sort((a, b) => b.creado_en.localeCompare(a.creado_en))
      .map(p => {
        const c = BD.usuarios.find(u => u.id === p.usuario_id) || {};
        return Object.assign({}, p, {
          cliente: c.nombre, usuario: c.usuario, telefono: c.telefono,
          tipo_cliente: c.tipo_cliente, saldo: c.saldo, items: BD.items.filter(i => i.pedido_id === p.id)
        });
      });
    return { ok: true, items };
  },
  admin_actualizar_pedido({ p_token, p_pedido, p_datos }) {
    exige(p_token, ["admin"]);
    const p = BD.pedidos.find(x => x.id === p_pedido);
    if (!p) return { ok: false, motivo: "Pedido no encontrado" };
    const u = BD.usuarios.find(x => x.id === p.usuario_id);
    if (p_datos.estado === "cancelado" && p.estado !== "cancelado") {
      let regresa = 0;
      BD.items.filter(i => i.pedido_id === p.id && i.estado === "asignado").forEach(i => {
        const pr = BD.productos.find(x => x.id === i.producto_id);
        if (pr) {
          pr.disponible += i.cantidad;
          pr.vendidos = Math.max(0, pr.vendidos - i.cantidad);
          if (pr.estado === "agotado") pr.estado = "activo";
        }
        i.estado = "rechazado"; i.motivo = "Pedido cancelado";
        regresa += i.precio * i.cantidad;
      });
      if (regresa) movimiento(u, "devolucion", redondea(regresa), "Cancelación " + p.folio, p.folio);
      p.total = 0;
    }
    ["estado", "guia", "paqueteria", "notas_izma", "envio"].forEach(k => { if (p_datos[k] !== undefined) p[k] = p_datos[k]; });
    p.actualizado_en = ahora();
    guardarBD();
    return { ok: true };
  },
  admin_rechazar_item({ p_token, p_item, p_motivo }) {
    exige(p_token, ["admin"]);
    const i = BD.items.find(x => x.id === p_item);
    if (!i || i.estado !== "asignado") return { ok: false, motivo: "Esa partida ya no está asignada" };
    devolverPartida(i, p_motivo);
    return { ok: true };
  },
  admin_productos({ p_token, p_busqueda }) {
    exige(p_token, ["admin"]);
    liberar();
    const q = String(p_busqueda || "").toLowerCase();
    const items = BD.productos.filter(p => !q || p.titulo.toLowerCase().includes(q))
      .sort((a, b) => b.creado_en.localeCompare(a.creado_en))
      .map(p => Object.assign({}, p, {
        apartados: apartadasDe(p.id),
        vendedor: (BD.usuarios.find(v => v.id === p.vendedor_id) || {}).nombre || "IZMA"
      }));
    return { ok: true, items };
  },
  admin_guardar_config({ p_token, p_datos }) {
    exige(p_token, ["admin"]);
    Object.assign(BD.config, p_datos, {
      minutos_apartado: Math.max(1, parseInt(p_datos.minutos_apartado || BD.config.minutos_apartado, 10)),
      tope_transferencia: Number(p_datos.tope_transferencia || BD.config.tope_transferencia),
      retiro_min: Number(p_datos.retiro_min || BD.config.retiro_min),
      retiro_max: Number(p_datos.retiro_max || BD.config.retiro_max),
      retiro_multiplo: Number(p_datos.retiro_multiplo || BD.config.retiro_multiplo)
    });
    guardarBD();
    return { ok: true, config: Object.assign({}, BD.config) };
  }
};

  const cliente = E.yo.rol === "cliente";
  return '<article class="pieza ' + (libre ? "" : "agotado") + '">' +
    '<div class="lienzo" data-galeria="' + p.id + '">' +
      (m ? (m.tipo === "video"
        ? '<video src="' + esc(m.url) + '" muted playsinline preload="metadata"></video>'
        : '<img src="' + esc(m.url) + '" alt="' + esc(p.titulo) + '" loading="lazy">')
        : '<div class="fila" style="height:100%;justify-content:center;color:#9AA3A7">Sin foto</div>') +
      '<span class="cinta">' + esc(p.categoria) + "</span>" +

      '<div class="fila entre"><span class="precio">' + dinero(p.precio) + "</span>" +

               : '<span class="sello rojo">Agotado</span>') + "</div>" +
      (p.origen ? '<div class="tenue">Origen: ' + esc(p.origen) + "</div>" : "") +

        '<button class="btn kraft" style="flex:1" data-apartar="' + p.id + '">Apartar</button></div>' : "") +

      (pendiente ? '<div class="mosaico alerta"><div class="cifra">' + dinero(pendiente) + "</div><span>depósitos sin cobrar</span></div>" : "") +

        '<div class="mov"><div><div>' + esc(m.concepto) + "</div>" +
        '<div class="tenue">' + fecha(m.creado_en) + " · saldo " + dinero(m.saldo) + "</div></div>" +
        '<div class="monto ' + (m.monto >= 0 ? "mas" : "menos") + '">' +
        (m.monto >= 0 ? "+" : "−") + dinero(Math.abs(m.monto)) + "</div></div>").join("")

function datosEnvio(p) {
  const vol = redondea(Number(p.largo_cm || 0) * Number(p.ancho_cm || 0) * Number(p.alto_cm || 0) *
                       Math.max(Number(p.bultos || 1), 1) / 1000000);
  const volumetrico = redondea(Number(p.largo_cm || 0) * Number(p.ancho_cm || 0) * Number(p.alto_cm || 0) *
                               Math.max(Number(p.bultos || 1), 1) / 5000);
  return { vol, volumetrico, cobrado: Math.max(Number(p.peso_kg || 0), volumetrico) };
}
const COMO_FLETE = { por_cobrar: "por cobrar al recibir", saldo: "cargado a tu saldo", izma: "lo paga IZMA" };

function bloqueEnvio(p) {
  if (!p.guia && !p.paqueteria && !p.peso_kg && !p.costo_envio) return "";
  const e = datosEnvio(p);
  const lin = (a, b) => '<div class="fila entre"><span class="tenue">' + a + '</span><span class="num">' + b + "</span></div>";
  return '<div class="mensaje info" style="margin-top:12px">' +
    (p.guia ? '<div style="font-weight:600;margin-bottom:6px">Guía ' + esc(p.guia) +
       (p.paqueteria ? " · " + esc(p.paqueteria) : "") + "</div>"
     : '<div style="font-weight:600;margin-bottom:6px">' + esc(p.paqueteria || "Envío") + " en preparación</div>") +
    (p.bultos ? lin("Bultos", p.bultos) : "") +
    (p.peso_kg ? lin("Peso", p.peso_kg + " kg") : "") +
    (e.vol ? lin("Volumen", e.vol.toFixed(3) + " m³ · volumétrico " + e.volumetrico.toFixed(1) + " kg") : "") +
    (p.costo_envio ? lin("Flete", dinero(p.costo_envio) + " · " + (COMO_FLETE[p.flete] || "")) : "") +
    (p.destino ? lin("Destino", esc(p.destino)) : "") +
    (p.enviado_en ? lin("Salió", fecha(p.enviado_en)) : "") +
    (p.entrega_estimada ? lin("Llega aprox.", esc(p.entrega_estimada)) : "") +
    "</div>";
}

async function pedidosCliente() {
  const d = await rpc("mis_pedidos", { p_token: E.token });

      (noAlcanzo ? '<div class="mosaico"><div class="cifra">' + noAlcanzo + "</div><span>partidas que no alcanzaste</span></div>" : "") +
    "</div>" +
    d.pedidos.map(p => {
    const et = ESTADO_PEDIDO[p.estado] || [p.estado, ""];
    const asignados = p.items.filter(i => i.estado === "asignado");
    const rechazados = p.items.filter(i => i.estado === "rechazado");
    return '<div class="tarjeta">' +
      '<div class="fila entre envolver"><h3 style="margin:0">' + esc(p.folio) + "</h3>" +
        '<span class="sello ' + et[1] + '">' + et[0] + "</span></div>" +
      '<div class="tenue">' + fecha(p.creado_en) + " · " +
        (p.envio === "recoge" ? "recoges en bodega" : "envío por paquetería, flete por cobrar") + "</div>" +
      (asignados.length ? '<div class="linea-arriba"><b>Asignado</b>' + asignados.map(i =>
        '<div class="fila entre"><span>' + i.cantidad + " × " + esc(i.titulo) + '</span><span class="num">' +
        dinero(i.precio * i.cantidad) + "</span></div>").join("") + "</div>" : "") +
      (rechazados.length ? '<div class="linea-arriba"><b>No alcanzaste</b>' + rechazados.map(i =>
        '<div class="fila entre"><span class="tachado">' + i.cantidad + " × " + esc(i.titulo) + '</span>' +
        '<span class="sello rojo">devuelto ' + dinero(i.precio * i.cantidad) + "</span></div>" +
        (i.motivo ? '<div class="tenue">' + esc(i.motivo) + "</div>" : "")).join("") + "</div>" : "") +
      '<div class="total" style="margin:10px 0 0"><span>Pagado con tu saldo</span><span class="cifra">' + dinero(p.total) + "</span></div>" +
      bloqueEnvio(p) +
      (p.notas_izma ? '<div class="mensaje kraft">' + esc(p.notas_izma) + "</div>" : "") +
      "</div>";
  }).join("");
}

async function verTicket(id) {
  try {
    const d = await rpc("ticket", { p_token: E.token, p_venta: id });
    if (!d.ok) throw new Error(d.motivo);
    const v = d.venta;
    const cuerpo =
      '<div class="ticket" id="ticket">' +
        '<div style="text-align:center;margin-bottom:10px">' +
          '<div style="font-size:26px;font-weight:700">IZMA ENVÍOS</div>' +
          '<div style="font-family:Inter,sans-serif;font-size:12px;color:#7C899C">Ticket de venta ' + esc(v.folio_ticket || "en curso") + "</div></div>" +
        '<h3>' + esc(v.nombre) + "</h3>" +
        '<div class="lin"><span>Vendedor</span><span>' + esc(v.vendedor) + "</span></div>" +
        (v.lugar ? '<div class="lin"><span>Bodega</span><span>' + esc(v.lugar) + "</span></div>" : "") +
        '<div class="lin"><span>Abierta</span><span>' + fecha(v.creado_en) + "</span></div>" +
        '<div class="lin"><span>Cerrada</span><span>' + (v.cerrado_en ? fecha(v.cerrado_en) : "—") + "</span></div>" +
        '<div class="corte">' +
          (d.lineas.length ? d.lineas.map(l =>
            '<div class="lin"><span>' + l.cantidad + " × " + esc(l.titulo) + '<br><span style="color:#7C899C">' +
            esc(l.cliente) + " · " + esc(l.folio) + '</span></span><span class="num">' + dinero(l.importe) + "</span></div>").join("")
            : '<div class="lin"><span>Sin ventas asignadas</span><span>—</span></div>') +
        "</div>" +
        '<div class="corte">' +
          '<div class="lin"><span>Piezas vendidas</span><span>' + d.lineas.reduce((s, l) => s + l.cantidad, 0) + "</span></div>" +
          '<div class="lin"><span>Total vendido</span><span class="num">' + dinero(v.vendido) + "</span></div>" +
          '<div class="lin"><span>Comisión vendedor (' + v.comision_pct + "%)</span><span class=\"num\">− " + dinero(v.comision) + "</span></div>" +
          '<div class="final"><span>Total a pagar a IZMA</span><b class="num">' + dinero(v.a_izma) + "</b></div>" +
        "</div></div>";

    const texto = "IZMA ENVÍOS · Ticket " + (v.folio_ticket || "") + "\n" + v.nombre +
      "\nVendedor: " + v.vendedor + "\nFecha: " + fecha(v.cerrado_en || v.creado_en) +
      "\nVendido: " + dinero(v.vendido) + "\nComisión " + v.comision_pct + "%: " + dinero(v.comision) +
      "\nA pagar a IZMA: " + dinero(v.a_izma);

    hoja(cuerpo +
      '<div class="fila" style="margin-top:12px">' +
        '<button class="btn claro" style="flex:1" id="tk-print">Imprimir</button>' +
        '<a class="btn verde" style="flex:1;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=' +
          encodeURIComponent(texto) + '">Compartir</a></div>' +
      '<button class="btn lleno claro" style="margin-top:8px" data-cerrar>Cerrar</button>');

    $("#tk-print").onclick = () => {
      const w = window.open("", "_blank");
      if (!w) return aviso("Tu navegador bloqueó la ventana de impresión", "mal");
      w.document.write('<html><head><title>Ticket IZMA</title><style>body{font-family:sans-serif;padding:18px;max-width:420px}' +
        '.lin{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}.corte{border-top:2px dashed #ccc;margin-top:12px;padding-top:12px}' +
        '.final{display:flex;justify-content:space-between;border-top:1px solid #999;margin-top:8px;padding-top:8px;font-size:18px;font-weight:700}' +
        "</style></head><body>" + $("#ticket").innerHTML + "</body></html>");
      w.document.close();
      w.focus();
      w.print();
    };
  } catch (err) { aviso(err.message, "mal"); }
}

function fichaInventario(p) {
  const m = (p.media || [])[0];
  return '<article class="pieza"><div class="lienzo">' +
    (m ? (m.tipo === "video"
      ? '<video src="' + esc(m.url) + '" muted playsinline preload="metadata"></video>'
      : '<img src="' + esc(m.url) + '" alt="" loading="lazy">') : "") +
    '<span class="cinta">' + esc(p.estado) + "</span></div>" +
    '<div class="cuerpo"><div class="titulo">' + esc(p.titulo) + "</div>" +
      '<div class="fila envolver">' +
        '<span class="sello verde num">' + p.disponible + " en existencia</span>" +
        '<span class="sello kraft num">' + p.apartados + " apartadas</span>" +
        '<span class="sello num">' + p.vendidos + " vendidas</span></div>" +
      '<div class="fila entre"><span class="precio">' + dinero(p.precio) + "</span>" +
        '<button class="btn claro chico" data-editar="' + p.id + '">Editar</button></div>' +
      '<div class="tenue">' + esc(p.origen || "") + " · " + fecha(p.creado_en) + "</div></div></article>";
}
function enlazarEditar(lista) {
  $$("[data-editar]").forEach(b => b.onclick = () => {
    const p = lista.find(x => x.id === b.dataset.editar) || {};
    hoja("<h2>Editar producto</h2>" +
      '<label class="campo"><span>Nombre</span><input id="e-titulo" value="' + esc(p.titulo || "") + '"></label>' +
      '<div class="dos">' +
        '<label class="campo"><span>Precio</span><input id="e-precio" inputmode="decimal" value="' + (p.precio || 0) + '"></label>' +
        '<label class="campo"><span>Piezas totales</span><input id="e-cant" inputmode="numeric" value="' + (p.cantidad || 0) + '"></label></div>' +
      '<label class="campo"><span>Estado</span><select id="e-estado">' +
        '<option value="activo"' + (p.estado !== "oculto" ? " selected" : "") + ">Visible en la bodega</option>" +
        '<option value="oculto"' + (p.estado === "oculto" ? " selected" : "") + ">Oculto</option></select></label>" +
      '<div class="mensaje info">Tiene ' + (p.apartados || 0) + " apartadas y " + (p.vendidos || 0) + " vendidas.</div>" +
      '<button class="btn lleno" id="e-guardar">Guardar</button>' +
      '<button class="btn lleno claro" style="margin-top:8px" data-cerrar>Cancelar</button>');
    $("#e-guardar").onclick = async () => {
      try {
        const r = await rpc("editar_producto", {
          p_token: E.token, p_id: p.id,
          p_datos: { titulo: $("#e-titulo").value, precio: Number($("#e-precio").value || 0),
                     cantidad: parseInt($("#e-cant").value || "0", 10), estado: $("#e-estado").value }

        if (!r.ok) throw new Error(r.motivo);
        cerrarHoja(); aviso("Producto actualizado", "bien"); pintar();
      } catch (err) { aviso(err.message, "mal"); }
    };
  });
}

const METRICAS = {
  clientes: ["Clientes", n => n + (n === 1 ? " cliente" : " clientes")],
  pedidos:  ["Pedidos enviados", n => n + (n === 1 ? " pedido" : " pedidos")],
  importe:  ["Monto vendido", n => dinero(n)]
};

function bloqueMapa(m, edoFiltro) {
  const metrica = E.datos.metricaMapa || "clientes";
  const vals = Object.values(m.estados).map(e => e[metrica]);
  const max = Math.max(1, ...vals);
  const tono = v => {
    if (!v) return "#E4E7E8";
    const p = v / max;
    if (p > 0.75) return "#0B6B3A";
    if (p > 0.5)  return "#0F8A4C";
    if (p > 0.25) return "#5FBB8A";
    return "#BFE3CE";
  };
  const conDatos = Object.entries(m.estados)
    .filter(([, e]) => e[metrica] > 0)
    .sort((a, b) => b[1][metrica] - a[1][metrica]);

  return '<div class="tarjeta" style="margin-bottom:12px">' +
    '<div class="fila entre envolver" style="margin-bottom:8px">' +
      "<h2 style=\"margin:0\">Mapa de clientes</h2>" +
      '<div class="filtros" style="margin:0">' + Object.keys(METRICAS).map(k =>
        '<button data-m="' + k + '" aria-current="' + (metrica === k) + '">' + METRICAS[k][0] + "</button>").join("") + "</div></div>" +
    '<svg class="mapa" viewBox="' + MAPA_MX.viewBox + '" role="img" aria-label="Mapa de México">' +
      MAPA_MX.estados.map(e => {
        const dat = m.estados[e.i] || { clientes: 0, pedidos: 0, importe: 0, kilos: 0 };
        return '<path d="' + e.d + '" data-edo="' + e.i + '" data-sel="' + (edoFiltro === e.i ? 1 : 0) +
          '" fill="' + tono(dat[metrica]) + '"><title>' + e.n + ": " + dat.clientes + " clientes · " +
          dat.pedidos + " pedidos · " + dinero(dat.importe) + "</title></path>";
      }).join("") +
    "</svg>" +
    '<div class="escala"><span>menos</span>' +
      ["#BFE3CE", "#5FBB8A", "#0F8A4C", "#0B6B3A"].map(c => '<i style="background:' + c + '"></i>').join("") +
      "<span>más</span>" +
      (m.sin_estado ? '<span style="margin-left:auto">' + m.sin_estado + " sin estado capturado</span>" : "") + "</div>" +
    (conDatos.length ? '<div class="linea-arriba">' + conDatos.slice(0, 8).map(([id, e]) =>
      '<div class="fila entre" style="padding:3px 0"><span>' + esc(NOMBRE_ESTADO[id] || id) + "</span>" +
      '<span class="num">' + e.clientes + " cli · " + e.pedidos + " ped · " + dinero(e.importe) + "</span></div>").join("") + "</div>" : "") +
    (edoFiltro ? '<button class="btn claro chico" style="margin-top:10px" data-limpiar-edo>Ver todos los estados</button>'
               : '<p class="tenue" style="margin:10px 0 0">Toca un estado para filtrar la lista de abajo.</p>') +
  "</div>";
}

function enlazarMapa(m) {
  $$("[data-edo]").forEach(p => p.onclick = () => {
    E.datos.estadoMapa = E.datos.estadoMapa === p.dataset.edo ? "" : p.dataset.edo;
    pintar();
  });
  $$("[data-m]").forEach(b => b.onclick = () => { E.datos.metricaMapa = b.dataset.m; pintar(); });
  if ($("[data-limpiar-edo]")) $("[data-limpiar-edo]").onclick = () => { E.datos.estadoMapa = ""; pintar(); };
}

const ESTADO_RECO = {
  solicitada:  ["Solicitada", "kraft"],
  programada:  ["Programada", "kraft"],
  no_recogida: ["No se pudo recoger", "rojo"],
  recolectada: ["Ya la recogimos", "verde"],
  en_bodega:   ["En bodega IZMA", "verde"],
  enviada:     ["Enviada al cliente", "verde"],
  cancelada:   ["Cancelada", ""]
};

const mapsBuscar = t => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(t);

function bloqueRuta(ruta) {
  if (!ruta.length) return '<div class="mensaje verde">No hay nada pendiente de recoger. Ruta limpia.</div>';
  const porBodega = {};
  ruta.forEach(r => { (porBodega[r.bodega] = porBodega[r.bodega] || []).push(r); });
  const paradas = Object.keys(porBodega);
  const puntos = paradas.map(b => {
    const uno = porBodega[b][0];
    return (uno.direccion ? uno.direccion + ", " : "") + b + ", Tijuana";
  });
  const liga = puntos.length === 1
    ? mapsBuscar(puntos[0])
    : "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(puntos[puntos.length - 1]) +
      (puntos.length > 1 ? "&waypoints=" + puntos.slice(0, -1).slice(0, 9).map(encodeURIComponent).join("%7C") : "");

  return '<div class="tarjeta" style="margin-bottom:12px">' +
    '<div class="fila entre envolver"><h2 style="margin:0">Ruta de recolección</h2>' +
      '<a class="btn verde chico" style="text-decoration:none" target="_blank" rel="noopener" href="' + liga + '">Abrir ruta en Maps</a></div>' +
    '<p class="tenue" style="margin:4px 0 10px">' + paradas.length + (paradas.length === 1 ? " parada · " : " paradas · ") +
      ruta.length + (ruta.length === 1 ? " paquete" : " paquetes") +
      ". Lo que marques como recogido sale de esta lista.</p>" +
    paradas.map((b, n) => {
      const items = porBodega[b];
      const dir = (items[0].direccion ? items[0].direccion + ", " : "") + b + ", Tijuana";
      return '<div class="linea-arriba">' +
        '<div class="fila entre envolver"><b>' + (n + 1) + ". " + esc(b) + "</b>" +
          '<a class="btn claro chico" style="text-decoration:none" target="_blank" rel="noopener" href="' +
            mapsBuscar(dir) + '">Cómo llegar</a></div>' +
        (items[0].direccion ? '<div class="tenue">' + esc(items[0].direccion) + "</div>" : "") +
        items.map(r => '<div class="renglon"><div class="crece">' +
          (r.a_nombre ? '<div style="font-weight:600">A nombre de: ' + esc(r.a_nombre) + "</div>" : "") +
          '<div class="tenue">' + esc(r.cliente || "") + (r.referencia ? " · orden " + esc(r.referencia) : "") +
            " · " + r.piezas + " piezas" + (r.programada ? " · " + esc(r.programada) : "") + "</div>" +
          (r.descripcion ? '<div class="tenue">' + esc(r.descripcion) + "</div>" : "") +
          '<div class="fila" style="margin-top:6px">' +
            '<button class="btn verde chico" data-recogi="' + r.id + '">Recogido</button>' +
            '<button class="btn claro chico" data-nopude="' + r.id + '">No se pudo</button></div>' +
        "</div></div>").join("") + "</div>";
    }).join("") + "</div>";
}

function enlazarRuta(ruta) {
  $$("[data-recogi]").forEach(b => b.onclick = () => {
    const r = ruta.find(x => x.id === b.dataset.recogi);
    hoja("<h2>Recogido</h2>" +
      '<p class="tenue" style="margin-top:0">' + esc(r.bodega) +
        (r.a_nombre ? " · a nombre de " + esc(r.a_nombre) : "") + "</p>" +
      '<div class="dos">' +
        '<label class="campo"><span>Bultos</span><input id="rg-bultos" inputmode="numeric" value="' + (r.piezas || 1) + '"></label>' +
        '<label class="campo"><span>Peso (kg)</span><input id="rg-peso" inputmode="decimal"></label></div>' +
      '<label class="campo"><span>Costo de la recolección</span><input id="rg-costo" inputmode="decimal" value="' + (r.costo || 0) + '"></label>' +
      (E.yo.rol === "admin" && !r.costo_cobrado
        ? '<label class="campo"><span>¿Se lo cobramos ya a su saldo?</span><select id="rg-cobrar">' +
          '<option value="no">Todavía no</option><option value="si">Sí, descontar ahora</option></select></label>' : "") +
      '<label class="campo"><span>Nota (opcional)</span><input id="rg-nota"></label>' +
      '<button class="btn lleno verde" id="rg-ok">Guardar y sacar de la ruta</button>' +
      '<button class="btn lleno claro" style="margin-top:8px" data-cerrar>Cancelar</button>');
    $("#rg-ok").onclick = async () => {
      const cobrar = $("#rg-cobrar") && $("#rg-cobrar").value === "si";
      const costo = Number($("#rg-costo").value || 0);
      try {
        let pin = null;
        if (cobrar && costo > 0) { pin = await pedirPin("cobrarle la recolección"); if (!pin) return; }
        const res = await rpc("admin_actualizar_recoleccion", {
          p_token: E.token, p_recoleccion: r.id, p_pin_hash: pin,
          p_datos: { estado: "recolectada", bultos: Number($("#rg-bultos").value || 0),
                     peso_kg: Number($("#rg-peso").value || 0), costo, cobrar,
                     recolector: E.yo.nombre, nota_izma: $("#rg-nota").value }
        });
        if (!res.ok) throw new Error(res.motivo);
        cerrarHoja(); aviso("Recogido. Ya está en bodega.", "bien"); pintar();
      } catch (err) { aviso(err.message, "mal"); }
    };
  });

        '<label class="campo"><span>Estado</span><select id="cx-estado">' +

          " kg</b> · cobran sobre <b>" + e.cobrado.toFixed(1) + " kg</b>"
        : "Captura medidas y peso para calcular el volumen.";
    };
    ["cx-largo", "cx-ancho", "cx-alto", "cx-bultos", "cx-peso"].forEach(id => $("#" + id).oninput = recalcular);
    recalcular();

    $("#cx-ok").onclick = async () => {
      const datos = {
        paqueteria: $("#cx-paq").value, guia: $("#cx-guia").value,
        bultos: Number($("#cx-bultos").value || 1), peso_kg: Number($("#cx-peso").value || 0),

        alto_cm: Number($("#cx-alto").value || 0), costo_envio: Number($("#cx-costo").value || 0),
        flete: $("#cx-flete").value, estado: $("#cx-estado").value,
        entrega_estimada: $("#cx-fecha").value, notas_izma: $("#cx-nota").value
      };
      try {
        let pin = null;
        if (datos.flete === "saldo" && datos.costo_envio > 0 && !c.flete_cobrado) {
          pin = await pedirPin("cobrarle el flete de la caja");
          if (!pin) return;
        }
        const r = await rpc("admin_guardar_caja", { p_token: E.token, p_caja: c.id, p_datos: datos, p_pin_hash: pin });
        if (!r.ok) throw new Error(r.motivo);
        cerrarHoja(); aviso("Caja actualizada", "bien"); pintar();
      } catch (err) { aviso(err.message, "mal"); }
    };
  });
}

      if (!el.dataset.avisado) {
        el.dataset.avisado = "1";
        if (el.dataset.tipo === "apartado") aviso("Se venció tu apartado", "mal");
        pintar();
      }
      return;
    }
    const s = Math.floor(falta / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    el.textContent = h >= 1
      ? "⏱ " + h + " h " + String(m).padStart(2, "0") + " min"
      : "⏱ " + String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    if (!el.classList.contains("calmo")) el.classList.toggle("tibio", s > 60);
  });
}, 1000);

setInterval(() => {
  if (E.yo && E.vista === "bodega" && document.visibilityState === "visible" && !$("#capa").classList.contains("abierta")) pintar();
}, 25000);

/* ===================== 14. errores visibles ===================== */
function fallo(msj) {
  const caja = $("#claves-demo");
  if (caja) caja.innerHTML = '<div class="mensaje rojo" style="margin-top:14px"><b>Algo falló</b><br>' + esc(msj) + "</div>";
  aviso(msj, "mal");
}
window.addEventListener("error", e => fallo(e.message || "Error inesperado"));
window.addEventListener("unhandledrejection", e => fallo((e.reason && e.reason.message) || "Error inesperado"));

/* ===================== 15. arranque ===================== */
(async () => {
  try {
  const sel = $("#sel-estado");
  if (sel) sel.innerHTML = OPCIONES_ESTADO("");
  if (MODO_DEMO) {
    await cargarBD();
    $("#claves-demo").innerHTML =
      '<div class="mensaje kraft" style="margin-top:14px"><b>Datos de prueba</b> · PIN 1234<br>' +
      "admin · vendedor · maria · jose</div>";
  } else if (SUPABASE_ANON.indexOf("TU_ANON") >= 0 || SUPABASE_ANON.length < 20) {
    $("#claves-demo").innerHTML =
      '<div class="mensaje rojo" style="margin-top:14px"><b>Falta conectar Supabase</b><br>' +
      "Pon SUPABASE_URL y SUPABASE_ANON al inicio del archivo.</div>";
  }
  if (!E.token) return;
  try {
    const s = await rpc("sesion", { p_token: E.token });
    if (!s.ok) return salirLocal();
    E.yo = s.usuario; E.config = s.config;
    arrancarApp();
  } catch { salirLocal(); }
  } catch (err) { fallo(err.message); }
})();
</script>
